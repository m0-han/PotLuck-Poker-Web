firebase.initializeApp(firebaseConfig);

// --- STATE MANAGEMENT ---
let currentUser = null;
let userRole = 'VISITOR'; // Roles: 'SUPER_ADMIN', 'ADMIN', 'VISITOR'

let PRESET_PLAYERS = [
  "BabaVanga", "Shubham", "Vishal Sinha", "Kochhar", "Kshitij",
  "Boaz", "Sheki", "Abhilash", "Sreenivas", "Guruji",

];

// NAME DEDUPLICATION MAP: "Spelling Mistake / Variant": "Correct Standard Name"
const PLAYER_ALIASES = {
  "Shubam": "Shubham",
  "Chinmayee": "Chinmay",
  "MK": "BabaVanga",
  "Mohan": "BabaVanga",
  "Jisho": "Boaz",

};

// Hidden player names list (Synced with Firebase)
let hiddenPlayerNames = new Set();

// Helper to sanitize player names across the entire app
function normalizePlayerName(name) {
  if (!name) return '';
  const trimmed = name.trim();
  return PLAYER_ALIASES[trimmed] || trimmed;
}

let activeGame = null;
let historyGames = [];
let editingGameId = null;
let leaderboardData = {};
let selectedPresetPlayers = new Set();
let allUsersList = [];

// --- FIREBASE REALTIME LISTENERS ---
function initRealtimeListeners() {
  // Listen for Active Game changes
  db.collection('poker_sessions').doc('active_session').onSnapshot(doc => {
    if (doc.exists) {
      activeGame = doc.data();
      if (activeGame && activeGame.status === 'ACTIVE') {
        document.getElementById('ledgerTabBtn').style.display = (userRole !== 'VISITOR') ? 'block' : 'none';
      } else {
        activeGame = null;
        document.getElementById('ledgerTabBtn').style.display = 'none';
      }
    } else {
      activeGame = null;
      document.getElementById('ledgerTabBtn').style.display = 'none';
    }
    renderAll();
  }); // <--- Fixed typo colon to closing bracket/semicolon

  // Listen for Hidden Players Configuration
  db.collection('poker_config').doc('hidden_players').onSnapshot(doc => {
    if (doc.exists && doc.data().names) {
      hiddenPlayerNames = new Set(doc.data().names);
    } else {
      hiddenPlayerNames.clear();
    }
    renderAll();
  });

  // Listen for History Games
  db.collection('poker_history').orderBy('id', 'desc').onSnapshot(snapshot => {
    historyGames = [];
    snapshot.forEach(doc => {
      historyGames.push(doc.data());
    });
    renderAll();
  });

  // Listen for User Roles (Super Admin View)
  db.collection('users').onSnapshot(snapshot => {
    allUsersList = [];
    snapshot.forEach(doc => {
      allUsersList.push({ uid: doc.id, ...doc.data() });
    });
    if (userRole === 'SUPER_ADMIN') renderUsersList();
  });
}

// --- AUTHENTICATION & ROLE MANAGEMENT ---
auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  if (user) {
    document.getElementById('userEmailText').textContent = user.email;
    document.getElementById('authBtn').textContent = 'Logout';
    
    try {
      const userRef = db.collection('users').doc(user.uid);
      const doc = await userRef.get();
      
      if (doc.exists) {
        userRole = doc.data().role || 'VISITOR';
      } else {
        const snapshot = await db.collection('users').get();
        userRole = snapshot.empty ? 'SUPER_ADMIN' : 'VISITOR';
        await userRef.set({ email: user.email, role: userRole });
      }
    } catch (e) {
      console.error("Auth error:", e);
      userRole = 'VISITOR';
    }
  } else {
    currentUser = null;
    userRole = 'VISITOR';
    document.getElementById('userEmailText').textContent = 'Visitor Mode';
    document.getElementById('authBtn').textContent = 'Login';
  }

  updateRoleUI();
  initRealtimeListeners();
});

function updateRoleUI() {
  const badge = document.getElementById('userRoleBadge');
  badge.textContent = userRole.replace('_', ' ');
  badge.className = 'role-pill ' + (
    userRole === 'SUPER_ADMIN' ? 'role-superadmin' :
    userRole === 'ADMIN' ? 'role-admin' : 'role-visitor'
  );

  const isAdmin = (userRole === 'ADMIN' || userRole === 'SUPER_ADMIN');
  const isSuperAdmin = (userRole === 'SUPER_ADMIN');

  document.querySelectorAll('.admin-only').forEach(el => {
    el.style.display = isAdmin ? '' : 'none';
  });

  document.querySelectorAll('.superadmin-only').forEach(el => {
    el.style.display = isSuperAdmin ? '' : 'none';
  });

  if (!isAdmin && document.getElementById('create').classList.contains('active')) {
    switchTab('quick', document.querySelectorAll('.tab-btn')[1]);
  }
}

function toggleAuthModal() {
  if (currentUser) {
    auth.signOut();
    toast('Logged out successfully');
  } else {
    document.getElementById('authModal').classList.add('show');
  }
}

async function handleLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  const remember = document.getElementById('authRemember').checked;

  if (!email || !pass) return toast('Please enter email and password');

  try {
    const persistence = remember 
      ? firebase.auth.Auth.Persistence.LOCAL 
      : firebase.auth.Auth.Persistence.SESSION;

    await auth.setPersistence(persistence);
    await auth.signInWithEmailAndPassword(email, pass);
    closeModal('authModal');
    toast('Logged in successfully ✓');
  } catch (err) {
    toast(err.message);
  }
}

async function handleForgotPassword(event) {
  if (event) event.preventDefault();
  const email = document.getElementById('authEmail').value.trim();

  if (!email) {
    return toast('Enter your email address above first!');
  }

  try {
    await auth.sendPasswordResetEmail(email);
    toast('Password reset link sent to your email 📧');
  } catch (err) {
    toast(err.message);
  }
}

async function handleSignUp() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  try {
    await auth.createUserWithEmailAndPassword(email, pass);
    closeModal('authModal');
    toast('Account created successfully ✓');
  } catch (err) {
    toast(err.message);
  }
}

async function updateUserRole(uid, newRole) {
  if (userRole !== 'SUPER_ADMIN') return toast('Permission denied');
  try {
    await db.collection('users').doc(uid).update({ role: newRole });
    toast('User role updated');
  } catch (err) {
    toast('Error updating role: ' + err.message);
  }
}

/* TOGGLE PLAYER VISIBILITY (SUPER ADMIN ONLY) */
async function togglePlayerVisibility(playerName) {
  if (userRole !== 'SUPER_ADMIN') return toast('Super Admin privileges required');
  
  const cleanName = normalizePlayerName(playerName);
  if (hiddenPlayerNames.has(cleanName)) {
    hiddenPlayerNames.delete(cleanName);
  } else {
    hiddenPlayerNames.add(cleanName);
  }

  try {
    await db.collection('poker_config').doc('hidden_players').set({
      names: Array.from(hiddenPlayerNames)
    });
    toast(`${cleanName} is now ${hiddenPlayerNames.has(cleanName) ? 'Hidden 🙈' : 'Visible 👁️'}`);
  } catch (err) {
    toast('Error updating visibility: ' + err.message);
  }
}

/* ENHANCED USER & PLAYER VISIBILITY CONTROL PANEL */
function renderUsersList() {
  const container = document.getElementById('usersList');
  
  const allKnownPlayers = new Set();
  PRESET_PLAYERS.forEach(p => allKnownPlayers.add(normalizePlayerName(p)));
  historyGames.forEach(g => g.players.forEach(p => allKnownPlayers.add(normalizePlayerName(p))));

  let html = `
    <div class="card" style="margin-bottom:14px">
      <div class="eyebrow">LEADERBOARD VISIBILITY CONTROL</div>
      <h3>Hide / Unhide Player Names</h3>
      <div class="sub" style="margin-bottom:10px">Hidden players are omitted from public leaderboards & statistics without deleting historical records.</div>
      <div class="preset-chips">
        ${Array.from(allKnownPlayers).sort().map(name => {
          const isHidden = hiddenPlayerNames.has(name);
          return `
            <button class="chip-btn ${isHidden ? '' : 'selected'}" onclick="togglePlayerVisibility('${name}')">
              ${isHidden ? '🙈 Hidden: ' : '👁️ Visible: '}${name}
            </button>
          `;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">REGISTERED ACCOUNTS</div>
      <h3>User Access Roles</h3>
      ${allUsersList.map(u => `
        <div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">
          <div>
            <b>${u.email}</b>
            <div class="sub">UID: ${u.uid}</div>
          </div>
          <div>
            <select style="width:auto;min-height:30px;font-size:11px" onchange="updateUserRole('${u.uid}', this.value)" ${u.uid === currentUser.uid ? 'disabled' : ''}>
              <option value="VISITOR" ${u.role === 'VISITOR' ? 'selected' : ''}>VISITOR</option>
              <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
              <option value="SUPER_ADMIN" ${u.role === 'SUPER_ADMIN' ? 'selected' : ''}>SUPER ADMIN</option>
            </select>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  container.innerHTML = html;
}

// --- SYNC HELPERS ---
async function syncActiveGame() {
  if (userRole === 'VISITOR') return;
  if (activeGame) {
    await db.collection('poker_sessions').doc('active_session').set(activeGame);
  } else {
    await db.collection('poker_sessions').doc('active_session').delete();
  }
}

async function syncHistoryGame(gameObj) {
  if (userRole === 'VISITOR') return;
  await db.collection('poker_history').doc(String(gameObj.id)).set(gameObj);
}

// --- APP CORE FUNCTIONS ---
function setTodayDate() {
  let today = new Date();
  let yyyy = today.getFullYear();
  let mm = String(today.getMonth() + 1).padStart(2, '0');
  let dd = String(today.getDate()).padStart(2, '0');
  document.getElementById('gameDate').value = `${yyyy}-${mm}-${dd}`;
}
setTodayDate();

function formatDateDDMMYYYY(dateStr) {
  if(!dateStr) return '';
  let p = dateStr.split('-');
  if(p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
  return dateStr;
}

function toast(m) {
  let t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(t.x);
  t.x = setTimeout(() => t.classList.remove('show'), 1800);
}

function getTimeStr() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function logEvent(gameObj, actionType, details) {
  let entry = { id: Date.now(), time: getTimeStr(), action: actionType, details: details };
  if(gameObj && gameObj.logs) gameObj.logs.push(entry);
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('primary'));
  
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('primary');

  btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  renderAll();
}

async function startNewGame() {
  if (userRole === 'VISITOR') return toast('Admin privileges required');
  let title = document.getElementById('gameTitle').value.trim() || 'Mohans Poker Club';
  let rawDate = document.getElementById('gameDate').value || new Date().toISOString().split('T')[0];
  let formattedDate = formatDateDDMMYYYY(rawDate);
  
  let cash = Math.max(1, +document.getElementById('cash').value || 1000);
  let chips = Math.max(1, +document.getElementById('chips').value || 4000);
  let small = +document.getElementById('small').value || 50;
  let big = +document.getElementById('big').value || 100;

  activeGame = {
    id: Date.now(),
    title, date: formattedDate, rawDate, cash, chips, small, big,
    players: [],
    logs: [],
    status: 'ACTIVE'
  };

  logEvent(activeGame, 'Game Session Created', `Title: "${title}", Date: ${formattedDate}, Buy-in: ₹${cash}`);
  await syncActiveGame();
  
  toast('Game "' + title + '" started!');
  
  document.getElementById('calcRateCash').value = cash;
  document.getElementById('calcRateChips').value = chips;

  document.getElementById('ledgerTabBtn').style.display = 'block';
  switchTab('quick', document.querySelectorAll('.tab-btn')[1]);
}

function calculateNetPL(p) {
  if(!activeGame) return 0;
  let chipValue = (p.chips / activeGame.chips) * activeGame.cash;
  return chipValue - p.cash;
}

function renderQuickView() {
  if(!activeGame) {
    document.getElementById('quickGameTitle').textContent = 'No Active Game';
    document.getElementById('quickGameMeta').textContent = 'Create a game session to start adding players';
    document.getElementById('endSettleBtn').disabled = true;
    document.getElementById('addPlayerBtn').disabled = true;
    document.getElementById('quickPlayerList').innerHTML = `<div class="card"><div class="muted">No active game session. Go to "Create Game" tab to start one.</div></div>`;
    return;
  }

  document.getElementById('quickGameTitle').textContent = activeGame.title;
  document.getElementById('quickGameMeta').textContent = `${activeGame.date} · Blinds ₹${activeGame.small}/₹${activeGame.big} · ₹${activeGame.cash} = ${activeGame.chips} chips`;
  document.getElementById('endSettleBtn').disabled = false;
  document.getElementById('addPlayerBtn').disabled = false;

  let container = document.getElementById('quickPlayerList');
  if(activeGame.players.length === 0) {
    container.innerHTML = `<div class="card"><div class="muted">No players added yet. Click "+ Add Players" to bring players to the table.</div></div>`;
    return;
  }

  const isAdmin = (userRole === 'ADMIN' || userRole === 'SUPER_ADMIN');

  container.innerHTML = activeGame.players.map(p => {
    let displayName = normalizePlayerName(p.name);
    let pl = calculateNetPL(p);
    let plFormatted = (pl >= 0 ? '+' : '-') + '₹' + Math.abs(Math.round(pl)).toLocaleString('en-IN');
    let plClass = pl >= 0 ? 'pos' : 'neg';

    if(!p.active) {
      return `
        <div class="card removed-row">
          <div class="row">
            <div class="who">
              <div class="avatar">${displayName.slice(0,2).toUpperCase()}</div>
              <div>
                <b>${displayName}</b> <span class="tag">REMOVED</span>
                <div class="sub">Buy-ins: ${p.buyins} · ${p.chips.toLocaleString('en-IN')} chips</div>
              </div>
            </div>
            ${isAdmin ? `<button class="primary restore-btn" onclick="togglePlayer(${p.id})">Restore Player</button>` : ''}
          </div>
        </div>`;
    }

    let isSittingOut = !!p.sittingOut;

    return `
      <div class="card ${isSittingOut ? 'sitting-out' : ''}">
        <div class="row">
          <div class="who">
            <div class="avatar">${displayName.slice(0,2).toUpperCase()}</div>
            <div>
              <b>${displayName}</b> ${isSittingOut ? '<span class="tag tag-out">SITTING OUT</span>' : ''}
              <div class="sub">Buy-ins: <span class="count">${p.buyins}</span> · ${p.chips.toLocaleString('en-IN')} chips</div>
            </div>
          </div>
          <div style="text-align:right">
            <div class="sub">Live P / L</div>
            <b class="${plClass}">${plFormatted}</b>
          </div>
        </div>
        ${isAdmin ? `
        <div class="actions">
          <button class="primary" onclick="rebuy(${p.id})">+ Rebuy</button>
          <button onclick="undoBuyIn(${p.id})" ${p.buyins <= 1 ? 'disabled' : ''}>Undo</button>
          <button class="${isSittingOut ? 'warning' : ''}" onclick="toggleSitOut(${p.id})">${isSittingOut ? '▶ Resume' : '⏸ Sit Out'}</button>
          <button class="danger" onclick="togglePlayer(${p.id})">Remove</button>
        </div>` : ''}
      </div>`;
  }).join('');
}

async function rebuy(id) {
  if (userRole === 'VISITOR') return;
  let p = activeGame.players.find(x => x.id === id);
  if(!p || !p.active) return;
  p.cash += activeGame.cash;
  p.chips += activeGame.chips;
  p.buyins++;
  logEvent(activeGame, 'Rebuy', `${normalizePlayerName(p.name)} added 1 Rebuy (+₹${activeGame.cash}, +${activeGame.chips} chips)`);
  await syncActiveGame();
  toast(normalizePlayerName(p.name) + ' rebuy added ✓');
}

async function undoBuyIn(id) {
  if (userRole === 'VISITOR') return;
  let p = activeGame.players.find(x => x.id === id);
  if(!p || !p.active || p.buyins <= 1) return;
  p.cash -= activeGame.cash;
  p.chips -= activeGame.chips;
  p.buyins--;
  logEvent(activeGame, 'Undo Buy-in', `Undone 1 Buy-in for ${normalizePlayerName(p.name)} (-₹${activeGame.cash}, -${activeGame.chips} chips)`);
  await syncActiveGame();
  toast('Buy-in undone for ' + normalizePlayerName(p.name));
}

async function toggleSitOut(id) {
  if (userRole === 'VISITOR') return;
  let p = activeGame.players.find(x => x.id === id);
  if(!p || !p.active) return;
  p.sittingOut = !p.sittingOut;
  logEvent(activeGame, p.sittingOut ? 'Player Sit Out' : 'Player Resumed', `${normalizePlayerName(p.name)} is now ${p.sittingOut ? 'sitting out' : 'active'}`);
  await syncActiveGame();
  toast(normalizePlayerName(p.name) + (p.sittingOut ? ' is sitting out' : ' resumed play'));
}

async function togglePlayer(id) {
  if (userRole === 'VISITOR') return;
  let p = activeGame.players.find(x => x.id === id);
  if(!p) return;
  p.active = !p.active;
  logEvent(activeGame, p.active ? 'Player Restored' : 'Player Removed', `${normalizePlayerName(p.name)} was ${p.active ? 'restored to' : 'removed from'} active game`);
  await syncActiveGame();
  toast(normalizePlayerName(p.name) + (p.active ? ' restored' : ' removed'));
}

function openAddModal() {
  if (userRole === 'VISITOR') return;
  if(!activeGame) return toast('Create a game first!');
  selectedPresetPlayers.clear();
  renderPresetChips();
  document.getElementById('newName').value = '';
  document.getElementById('addModal').classList.add('show');
}

function renderPresetChips() {
  let freqMap = {};
  PRESET_PLAYERS.forEach(name => freqMap[name] = 0);

  historyGames.forEach(g => {
    g.players.forEach(p => {
      if(p.active) {
        let clean = normalizePlayerName(p.name);
        if(freqMap[clean] !== undefined) freqMap[clean]++;
      }
    });
  });

  let activeNames = new Set(activeGame ? activeGame.players.filter(p => p.active).map(p => normalizePlayerName(p.name)) : []);
  let sortedPresets = [...PRESET_PLAYERS].sort((a,b) => freqMap[b] - freqMap[a]);

  let html = sortedPresets.map(name => {
    let isAlreadyIn = activeNames.has(name);
    let isSelected = selectedPresetPlayers.has(name);
    let count = freqMap[name] || 0;

    if(isAlreadyIn) {
      return `<button class="chip-btn" disabled style="opacity:0.4">${name} <span class="freq-tag">In Game</span></button>`;
    }

    return `
      <button class="chip-btn ${isSelected ? 'selected' : ''}" onclick="togglePresetChip('${name}')">
        ${isSelected ? '✓ ' : '+ '}${name}
        ${count > 0 ? `<span class="freq-tag">${count}d</span>` : ''}
      </button>
    `;
  }).join('');

  document.getElementById('presetChipsContainer').innerHTML = html;
}

function togglePresetChip(name) {
  if(selectedPresetPlayers.has(name)) {
    selectedPresetPlayers.delete(name);
  } else {
    selectedPresetPlayers.add(name);
  }
  renderPresetChips();
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

async function confirmAddPlayer() {
  if (userRole === 'VISITOR') return;
  let rawNames = document.getElementById('newName').value;
  let customNames = rawNames.split(',').map(s => normalizePlayerName(s)).filter(s => s.length > 0);
  
  customNames.forEach(name => {
    let exists = PRESET_PLAYERS.some(p => p.toLowerCase() === name.toLowerCase());
    if(!exists) PRESET_PLAYERS.push(name);
  });

  let allToAdd = Array.from(selectedPresetPlayers).concat(customNames);
  if(allToAdd.length === 0) return toast('Select or enter at least one player');

  allToAdd.forEach(name => {
    let p = {id: Date.now() + Math.random(), name, chips: activeGame.chips, buyins: 1, cash: activeGame.cash, active: true, sittingOut: false};
    activeGame.players.push(p);
    logEvent(activeGame, 'Player Joined', `${name} joined with 1 starting buy-in (₹${activeGame.cash})`);
  });

  await syncActiveGame();
  closeModal('addModal');
  toast(`${allToAdd.length} player(s) added!`);
}

function handleSettlementKeydown(event, currentIndex, containerClass) {
  if (event.key === 'Enter') {
    event.preventDefault();
    let inputs = Array.from(document.querySelectorAll('.' + containerClass));
    if (currentIndex < inputs.length - 1) {
      inputs[currentIndex + 1].focus();
      inputs[currentIndex + 1].select();
    } else {
      inputs[currentIndex].blur();
      if(containerClass === 'settle-input') {
        finalizeAndArchiveGame();
      } else if(containerClass === 'edit-input') {
        saveEditedGame();
      }
    }
  }
}

function openSettleModal() {
  if (userRole === 'VISITOR') return;
  if(!activeGame || activeGame.players.length === 0) return toast('No players to settle!');
  let activeList = activeGame.players.filter(p => p.active);
  
  let inputsHtml = activeList.map((p, idx) => `
    <div class="settle-card-wrap">
      <div class="settle-row">
        <div><b>${normalizePlayerName(p.name)}</b> <span class="sub">(Paid ₹${p.cash})</span></div>
        <input type="number" class="settle-input" id="settleInp_${p.id}" data-id="${p.id}" value="" placeholder="0" oninput="updateSettleAudit()" onkeydown="handleSettlementKeydown(event, ${idx}, 'settle-input')">
      </div>
      <div class="quick-chip-btns">
        <button onclick="addChipsToInput('settleInp_${p.id}', 100)">+100</button>
        <button onclick="addChipsToInput('settleInp_${p.id}', 500)">+500</button>
        <button onclick="addChipsToInput('settleInp_${p.id}', 1000)">+1k</button>
        <button onclick="addChipsToInput('settleInp_${p.id}', 5000)">+5k</button>
      </div>
    </div>
  `).join('');
  
  document.getElementById('settleInputs').innerHTML = inputsHtml;
  document.getElementById('settleModal').classList.add('show');
  
  setTimeout(() => {
    let firstInp = document.querySelector('.settle-input');
    if(firstInp) firstInp.focus();
  }, 100);

  updateSettleAudit();
}

function addChipsToInput(inputId, amount) {
  let inp = document.getElementById(inputId);
  if(!inp) return;
  let val = Math.max(0, +inp.value || 0);
  inp.value = val + amount;
  updateSettleAudit();
}

function updateSettleAudit() {
  let totalIssued = activeGame.players.filter(p => p.active).reduce((s, p) => s + p.chips, 0);
  let totalCounted = 0;
  
  document.querySelectorAll('.settle-input').forEach(inp => {
    totalCounted += Math.max(0, +inp.value || 0);
  });

  document.getElementById('totalChipsIssued').textContent = totalIssued.toLocaleString('en-IN');
  document.getElementById('totalChipsCounted').textContent = totalCounted.toLocaleString('en-IN');

  let diff = totalCounted - totalIssued;
  let statusBox = document.getElementById('chipBalanceStatus');

  if(diff === 0) {
    statusBox.innerHTML = `<span class="tag pos">✓ Perfect Match</span>`;
  } else if(diff > 0) {
    statusBox.innerHTML = `<span class="tag neg">+${diff} Over Chips</span>`;
  } else {
    statusBox.innerHTML = `<span class="tag neg">${diff} Missing Chips</span>`;
  }
}

function calculateMinimalSettlements(balances) {
  let debtors = balances.filter(b => b.net < 0).map(b => ({ ...b, net: -b.net })).sort((a,b) => b.net - a.net);
  let creditors = balances.filter(b => b.net > 0).sort((a,b) => b.net - a.net);
  let settlements = [];
  let dIdx = 0, cIdx = 0;

  while(dIdx < debtors.length && cIdx < creditors.length) {
    let d = debtors[dIdx], c = creditors[cIdx];
    let amount = Math.min(d.net, c.net);
    if(amount > 0) {
      settlements.push({ from: d.name, to: c.name, amount });
      d.net -= amount;
      c.net -= amount;
    }
    if(d.net === 0) dIdx++;
    if(c.net === 0) cIdx++;
  }
  return settlements;
}

async function finalizeAndArchiveGame() {
  if (userRole === 'VISITOR') return;
  let activeList = activeGame.players.filter(p => p.active);
  let balances = [];

  document.querySelectorAll('.settle-input').forEach(inp => {
    let pid = +inp.dataset.id;
    let finalChips = Math.max(0, +inp.value || 0);
    let player = activeList.find(x => String(x.id) === String(pid));
    if(player) {
      player.finalChips = finalChips;
      let finalCash = (finalChips / activeGame.chips) * activeGame.cash;
      let netPL = Math.round(finalCash - player.cash);
      player.finalPL = netPL;
      balances.push({ id: player.id, name: normalizePlayerName(player.name), net: netPL });
    }
  });

  activeGame.settlements = calculateMinimalSettlements(balances);
  activeGame.status = 'COMPLETED';
  logEvent(activeGame, 'Game Ended', 'Final chip stack counts submitted & settlements calculated');
  
  await syncHistoryGame(activeGame);
  activeGame = null;
  await syncActiveGame();
  
  toast('Game ended & saved to History!');
  
  document.getElementById('ledgerTabBtn').style.display = 'none';
  closeModal('settleModal');
  switchTab('history', document.getElementById('historyTabBtn'));
}

function generateShareText(g) {
  let text = `🃏 *POTLUCK POKER SUMMARY*\n`;
  text += `📌 *${g.title}*\n`;
  text += `📅 ${g.date} | Blinds ₹${g.small}/₹${g.big}\n\n`;

  text += `*Settlements / Transfers:*\n`;
  if(g.settlements && g.settlements.length > 0) {
    g.settlements.forEach(s => {
      text += `• *${normalizePlayerName(s.from)}* pays *${normalizePlayerName(s.to)}* → ₹${s.amount.toLocaleString('en-IN')}\n`;
    });
  } else {
    text += `• No payment transfers required.\n`;
  }

  text += `\n*Individual Results:*\n`;
  g.players.filter(p => p.active).forEach(p => {
    let finalChips = p.finalChips || 0;
    let chipVal = Math.round((finalChips / g.chips) * g.cash);
    let pl = p.finalPL || 0;
    let sign = pl >= 0 ? '+' : '-';
    let buyinText = `${p.buyins} ${p.buyins === 1 ? 'Buy-in' : 'Buy-ins'}`;
    
    text += `• ${normalizePlayerName(p.name)}: ${buyinText} (₹${p.cash.toLocaleString('en-IN')}) | Chips Returned: ${finalChips.toLocaleString('en-IN')} (₹${chipVal.toLocaleString('en-IN')}) | P/L: ${sign}₹${Math.abs(pl).toLocaleString('en-IN')}\n`;
  });

  text += `\n_Recorded on Potluck Poker_ 🚀`;
  return text;
}

function copyGameSummaryText(gid) {

  container.appendChild(div);
}

function calculateSidePots() {
  let inputs = document.querySelectorAll('.sp-input');
  let bets = [];
  inputs.forEach((inp, i) => {
    let val = +inp.value || 0;
    if(val > 0) bets.push({ id: i + 1, bet: val });
  });

  if(bets.length < 2) {
    document.getElementById('sidePotResult').innerHTML = `<div class="sub" style="color:var(--orange)">Enter at least 2 player bet amounts.</div>`;
    return;
  }

  bets.sort((a,b) => a.bet - b.bet);
  let pots = [];
  let previousLevel = 0;

  bets.forEach((b, idx) => {
    let levelDiff = b.bet - previousLevel;
    if(levelDiff > 0) {
      let contributorsCount = bets.length - idx;
      let potAmount = levelDiff * contributorsCount;
      let eligible = bets.slice(idx).map(x => `Player ${x.id}`);
      pots.push({ name: idx === 0 ? 'Main Pot' : `Side Pot ${idx}`, amount: potAmount, eligible });
      previousLevel = b.bet;
    }
  });

  let html = pots.map(p => `
    <div class="card" style="background:#11150f;margin-bottom:6px">
      <div class="row">
        <b>${p.name}</b>
        <b class="count">${p.amount.toLocaleString('en-IN')} chips</b>
      </div>
      <div class="sub">Eligible: ${p.eligible.join(', ')}</div>
    </div>
  `).join('');

  document.getElementById('sidePotResult').innerHTML = html;
}

function runChipConvert(source) {
  let rateCash = +document.getElementById('calcRateCash').value || 1000;
  let rateChips = +document.getElementById('calcRateChips').value || 4000;
  if(rateCash <= 0 || rateChips <= 0) return;

  let ratio = rateCash / rateChips;

  if(source === 'chips') {
    let chips = +document.getElementById('calcChipsInput').value || 0;
    document.getElementById('calcCashInput').value = Math.round(chips * ratio);
  } else if(source === 'cash') {
    let cash = +document.getElementById('calcCashInput').value || 0;
    document.getElementById('calcChipsInput').value = Math.round(cash / ratio);
  } else {
    let chips = +document.getElementById('calcChipsInput').value || 0;
    document.getElementById('calcCashInput').value = Math.round(chips * ratio);
  }
}

function renderLeaderboard() {
  leaderboardData = {};

  historyGames.forEach(g => {
    g.players.forEach(p => {
      if (!p.active) return;
      const cleanName = normalizePlayerName(p.name);
      
      if (hiddenPlayerNames.has(cleanName) && userRole !== 'SUPER_ADMIN') {
        return;
      }

      if (!leaderboardData[cleanName]) {
        leaderboardData[cleanName] = { 
          name: cleanName, 
          days: 0, 
          profitDays: 0, 
          lossDays: 0, 
          breakEvenDays: 0, 
          totalPL: 0 
        };
      }
      
      leaderboardData[cleanName].days++;
      let pl = p.finalPL || 0;
      leaderboardData[cleanName].totalPL += pl;
      
      if (pl > 0) leaderboardData[cleanName].profitDays++;
      else if (pl < 0) leaderboardData[cleanName].lossDays++;
      else leaderboardData[cleanName].breakEvenDays++;
    });
  });

  let sorted = Object.values(leaderboardData).sort((a,b) => b.totalPL - a.totalPL);
  let container = document.getElementById('leaderboardList');

  if (sorted.length === 0) {
    container.innerHTML = `<div class="card"><div class="muted">No completed games yet.</div></div>`;
    return;
  }

  container.innerHTML = sorted.map((s, idx) => {
    let plFormatted = (s.totalPL >= 0 ? '+' : '-') + '₹' + Math.abs(s.totalPL).toLocaleString('en-IN');
    let plClass = s.totalPL >= 0 ? 'pos' : 'neg';

    let rankBadgeClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));
    let rankLabel = idx === 0 ? '🥇 1st' : (idx === 1 ? '🥈 2nd' : (idx === 2 ? '🥉 3rd' : `#${idx + 1}`));
    let isHidden = hiddenPlayerNames.has(s.name);

    return `
      <div class="card" style="padding:10px 12px; ${isHidden ? 'opacity:0.6;border-style:dashed;' : ''}">
        <div class="lb-single-row">
          <div style="display:flex;align-items:center;gap:8px;min-width:100px;max-width:170px">
            <div class="lb-rank ${rankBadgeClass}">${rankLabel}</div>
            <b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${s.name} ${isHidden ? '<span class="tag tag-out">HIDDEN</span>' : ''}
            </b>
          </div>

          <div class="lb-metrics-inline">
            <span>📅 ${s.days}</span>
            <span>📈 <b class="pos">${s.profitDays}</b></span>
            <span>📉 <b class="neg">${s.lossDays}</b></span>
            <span>🤝 <b>${s.breakEvenDays}</b></span>
          </div>

          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">Lifetime P/L</div>
            <b class="${plClass}" style="font-size:13px">${plFormatted}</b>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderOverallStats() {
  let pokerDays = historyGames.length;
  let uniquePlayers = new Set();
  let totalBuyins = 0;
  let totalBuyinVal = 0;
  let totalProfit = 0;
  let totalLoss = 0;
  let breakEvenVal = 0;
  let totalChipsIssued = 0;

  let maxWin = { amount: 0, player: '-', game: '-' };
  let maxLoss = { amount: 0, player: '-', game: '-' };
  let biggestPot = { amount: 0, game: '-' };
  let playerDaysMap = {};

  historyGames.forEach(g => {
    let gamePot = 0;
    g.players.forEach(p => {
      if(!p.active) return;
      let cleanName = normalizePlayerName(p.name);
      uniquePlayers.add(cleanName);
      totalBuyins += p.buyins;
      let cashSpent = p.cash;
      totalBuyinVal += cashSpent;
      gamePot += cashSpent;
      totalChipsIssued += (p.buyins * g.chips);

      playerDaysMap[cleanName] = (playerDaysMap[cleanName] || 0) + 1;

      let pl = p.finalPL || 0;
      if(pl > 0) {
        totalProfit += pl;
        if(pl > maxWin.amount) maxWin = { amount: pl, player: cleanName, game: g.title };
      } else if(pl < 0) {
        let absLoss = Math.abs(pl);
        totalLoss += absLoss;
        if(absLoss > maxLoss.amount) maxLoss = { amount: absLoss, player: cleanName, game: g.title };
      } else {
        breakEvenVal += cashSpent;
      }
    });

    if(gamePot > biggestPot.amount) {
      biggestPot = { amount: gamePot, game: g.title };
    }
  });

  document.getElementById('statPokerDays').textContent = pokerDays;
  document.getElementById('statUniquePlayers').textContent = uniquePlayers.size;
  document.getElementById('statTotalBuyins').textContent = totalBuyins;
  document.getElementById('statValueBuyins').textContent = '₹' + totalBuyinVal.toLocaleString('en-IN');
  document.getElementById('statTotalProfit').textContent = '₹' + totalProfit.toLocaleString('en-IN');
  document.getElementById('statTotalLoss').textContent = '₹' + totalLoss.toLocaleString('en-IN');
  document.getElementById('statBreakEvenVal').textContent = '₹' + breakEvenVal.toLocaleString('en-IN');
  document.getElementById('statChipsIssued').textContent = totalChipsIssued.toLocaleString('en-IN');

  let mostActive = Object.entries(playerDaysMap).sort((a,b) => b[1] - a[1])[0] || ['-', 0];
  let avgBuyinsPerPlayer = (totalBuyins / (pokerDays || 1)).toFixed(1);

  document.getElementById('funStatsList').innerHTML = `
    <div class="stat-row"><div>Biggest Single-Game Win</div><b class="pos">+₹${maxWin.amount.toLocaleString('en-IN')} (${maxWin.player})</b></div>
    <div class="stat-row"><div>Biggest Single-Game Loss</div><b class="neg">-₹${maxLoss.amount.toLocaleString('en-IN')} (${maxLoss.player})</b></div>
    <div class="stat-row"><div>Largest Game Cash Pot</div><b>₹${biggestPot.amount.toLocaleString('en-IN')} (${biggestPot.game})</b></div>
    <div class="stat-row"><div>Most Loyal Player</div><b>${mostActive[0]} (${mostActive[1]} days)</b></div>
    <div class="stat-row"><div>Avg Buy-ins per Session</div><b>${avgBuyinsPerPlayer} buy-ins</b></div>
  `;
}
